name: build-exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build deckmaker.exe
        run: pyinstaller --onefile --console --name deckmaker --collect-all gtts deckmaker.py

      - name: Smoke test executable
        run: .\dist\deckmaker.exe tests\sample.csv --no-audio --no-pause

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckmaker-windows
          path: dist/deckmaker.exe
          if-no-files-found: error

      - name: Attach to release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deckmaker.exe
