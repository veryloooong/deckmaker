name: build-exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build deckmaker.exe
        run: pyinstaller --onefile --console --name deckmaker --collect-all gtts deckmaker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deckmaker-windows
          path: dist/deckmaker.exe

      - name: Attach to release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deckmaker.exe
